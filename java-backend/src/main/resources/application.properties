spring.application.name=carddemo-java

# H2 in-memory database (mirrors VSAM KSDS files from mainframe)
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# H2 Console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema and seed data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT
jwt.secret=CardDemoSecretKeyForJWTTokenGenerationMustBe256Bits!
jwt.expiration-ms=86400000

# Server
server.port=8080

# Pagination defaults (replaces CICS paginated browse pattern)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Quartz Scheduler (replaces Control-M / JCL scheduling)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=CardDemoBatchScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# Batch job output directories
carddemo.batch.statements.output-dir=./output/statements
carddemo.batch.reports.output-dir=./output/reports
carddemo.batch.export.output-dir=./output/export
carddemo.batch.import.input-dir=./input
